<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotely</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="../../assets/icons/settings.svg" alt="Settings" class="icon left"/>
            <img src="../../assets/icons/theme.svg" alt="Theme" class="icon right"/>
        </header>
        
        <main class="quote-section">
            <h1 class="quote">“A person who never made a mistake never tried anything new.”</h1>
            <p class="author">~ Albert Einstein</p>
        
            <div class="meta">
                <div class="meta-item">
                    <img src="../../assets/icons/calendar.svg" alt="Year" class="icon"/>
                    <span>1921</span>
                </div>
                <div class="meta-item">
                    <img src="../../assets/icons/category.svg" alt="Category" class="icon"/>
                    <span>Innovation</span>
                </div>
            </div>
        
            <div class="actions">
                <button><img src="../../assets/icons/reload.svg" alt="Reload" class="icon"/> Reload</button>
                <button><img src="../../assets/icons/add.svg" alt="Add" class="icon"/> Add</button>
                <button><img src="../../assets/icons/bookmark.svg" alt="Save" class="icon"/></button>
                <button><img src="../../assets/icons/share.svg" alt="Share" class="icon"/></button>
            </div>
        </main>
    
        <hr class="hr-design">
            <section id="bookmarkedQuotes"></section>
        <hr class="hr-design">
            <section id="customQuotes"></section>
        <hr class="hr-design">

        <footer class="footer">
            <p>Made by <strong>@Flamevel</strong></p>
            <p>You can follow @Flamevel on <a href="https://github.com/Flamevel">GitHub</a> and @Flamevel.Official on <a href="https://youtube.com/@flamevel.official?si=R0VRAETqwqHKIfWJ">YouTube</a>.</p>
            <p>You can join the Discord Community <a href="https://discord.gg/hTrvqqHA3g">https://discord.gg/hTrvqqHA3g</a>.</p>
        </footer>
    </div>
    <script src="../scripts/main.js"></script>
    <script src="../scripts/theme.js"></script>
</body>
</html>
